name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: JARVIS_BETA_2.9.6_BUILD_READY

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: JARVIS_BETA_2.9.6_BUILD_READY/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Verify Java
        run: java -version

      - name: Verify Gradle
        run: ./gradlew --version

      - name: Clean project
        run: ./gradlew clean --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Find generated APK
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-BETA-2.9.6-debug-apk
          path: JARVIS_BETA_2.9.6_BUILD_READY/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
