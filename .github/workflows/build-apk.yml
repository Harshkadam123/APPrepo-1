name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect repository structure
        run: |
          echo "=== CURRENT DIRECTORY ==="
          pwd

          echo "=== ROOT CONTENTS ==="
          ls -la

          echo "=== SEARCHING FOR GRADLE WRAPPER ==="
          find . -name "gradlew" -type f -print

          echo "=== SEARCHING FOR SETTINGS FILE ==="
          find . -name "settings.gradle*" -type f -print

          echo "=== SEARCHING FOR APP MODULE ==="
          find . -maxdepth 4 -type d -name "app" -print

      - name: Stop if Gradle wrapper is missing
        run: |
          GRADLEW=$(find . -name "gradlew" -type f -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found anywhere in the repository."
            exit 1
          fi

          echo "Found Gradle wrapper:"
          echo "$GRADLEW"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: |
          GRADLEW=$(find . -name "gradlew" -type f -print -quit)
          chmod +x "$GRADLEW"

      - name: Show Gradle version
        run: |
          GRADLEW=$(find . -name "gradlew" -type f -print -quit)
          "$GRADLEW" --version
