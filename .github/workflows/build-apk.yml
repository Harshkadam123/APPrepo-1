name: Build JARVIS Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Verify Android project
        working-directory: ./JARVIS_BETA_2.9.6_BUILD_READY
        run: |
          echo "Checking Android project..."
          test -f gradlew
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          echo "Android project structure OK."

      - name: Make Gradle executable
        working-directory: ./JARVIS_BETA_2.9.6_BUILD_READY
        run: chmod +x ./gradlew

      - name: Show Java version
        run: java -version

      - name: Show Gradle version
        working-directory: ./JARVIS_BETA_2.9.6_BUILD_READY
        run: ./gradlew --version

      - name: Clean project
        working-directory: ./JARVIS_BETA_2.9.6_BUILD_READY
        run: ./gradlew clean --stacktrace

      - name: Build Debug APK
        working-directory: ./JARVIS_BETA_2.9.6_BUILD_READY
        run: ./gradlew assembleDebug --stacktrace

      - name: Find generated APK
        working-directory: ./JARVIS_BETA_2.9.6_BUILD_READY
        run: |
          echo "Generated APK files:"
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: JARVIS_BETA_2.9.6_BUILD_READY/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
